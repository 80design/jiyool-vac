name: Supabase keep-alive

on:
  schedule:
    # 매일 00:10 UTC (한국시간 09:10, GitHub 지연 있음)
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write keepalive row
        run: |
          BASE="https://rnarvhqlozqpyhzdjpjb.supabase.co/rest/v1/vax_records"
          KEY="sb_publishable_Ci91dOGSaMeZApQQYmusNA_CLWIUZR1"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CODE=$(curl -s --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
            -o /tmp/out.txt -w "%{http_code}" -X POST \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"family\":\"keepalive\",\"item_key\":\"ping\",\"done\":false,\"note\":\"$NOW\",\"updated_at\":\"$NOW\"}" \
            "$BASE?on_conflict=family,item_key")
          echo "WRITE HTTP $CODE"
          cat /tmp/out.txt
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ] && [ "$CODE" != "204" ]; then
            echo "::error::Supabase write failed with HTTP $CODE"
            exit 1
          fi
      - name: Read back
        run: |
          KEY="sb_publishable_Ci91dOGSaMeZApQQYmusNA_CLWIUZR1"
          curl -sf --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "https://rnarvhqlozqpyhzdjpjb.supabase.co/rest/v1/vax_records?select=item_key,note&family=eq.keepalive"
