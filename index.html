document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

x-shadow:0 18px 50px rgba(0,0,0,0.35)\">\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ syncError }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin:0 20px 16px;border-radius:14px;padding:13px 15px;background:#FDEFED;border:1px solid #F4DCD8\">\n      <div style=\"font-size:12.5px;font-weight:700;color:#AD4A40\">공유 저장소에 연결하지 못했어요<\u002Fdiv>\n      <div style=\"margin-top:5px;font-size:11.5px;color:#8C6B66;line-height:1.55\">{{ syncError }} · 기록은 이 기기에 계속 저장됩니다.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasNext }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin:0 20px 16px;border-radius:18px;padding:16px 17px;background:{{ nextBg }};border:1px solid {{ nextBorder }}\">\n      <div style=\"display:flex;align-items:center;gap:7px\">\n        <span style=\"width:7px;height:7px;border-radius:999px;background:{{ nextDot }};display:inline-block\"><\u002Fspan>\n        <span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.4px;color:{{ nextDot }}\">{{ nextKicker }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-top:8px;font-size:17px;font-weight:700;letter-spacing:-0.3px;line-height:1.35\">{{ nextTitle }}<\u002Fdiv>\n      <div style=\"margin-top:4px;font-size:13px;color:#6E667A\">{{ nextWhen }}<\u002Fdiv>\n      <sc-if value=\"{{ hasNextAfter }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:12px;padding-top:11px;border-top:1px dashed rgba(90,80,70,0.18);font-size:12.5px;color:#7E7688\">그다음 · {{ nextAfter }}<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;gap:7px;padding:2px 20px 14px;overflow-x:auto\">\n    <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ c.select }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:12px;padding:0 20px\">\n    <sc-for list=\"{{ ing:2px 0 2px 4px;cursor:pointer;line-height:1\">{{ d.caret }}<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ d.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:2px 16px 15px 58px;display:flex;flex-direction:column;gap:8px\">\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"font-size:11.5px;color:#8B8396;width:52px;flex:0 0 auto\">접종일<\u002Fspan>\n                  <input type=\"date\" value=\"{{ d.date }}\" sc-camel-on-change=\"{{ d.onDate }}\" style=\"flex:1;border:1px solid #E6DFD8;border-radius:10px;padding:8px 10px;font-size:13px;background:#FCFAF8;color:#3B3540;outline:none\">\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"font-size:11.5px;color:#8B8396;width:52px;flex:0 0 auto\">병원<\u002Fspan>\n                  <input type=\"text\" value=\"{{ d.hospital }}\" sc-camel-on-change=\"{{ d.onHospital }}\" placeholder=\"접종한 병원 이름\" style=\"flex:1;border:1px solid #E6DFD8;border-radius:10px;padding:8px 10px;font-size:13px;background:#FCFAF8;color:#3B3540;outline:none\">\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"font-size:11.5px;color:#8B8396;width:52px;flex:0 0 auto\">특이사항<\u002Fspan>\n                  <input type=\"text\" value=\"{{ d.note }}\" sc-camel-on-change=\"{{ d.onNote }}\" placeholder=\"이상반응 · 발열 등\" style=\"flex:1;border:1px solid #E6DFD8;border-radius:10px;padding:8px 10px;font-size:13px;background:#FCFAF8;color:#3B3540;outline:none\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ d.showMemo }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:0 16px 12px 58px;display:flex;flex-wrap:wrap;gap:6px\">\n                <sc-if value=\"{{ d.hospital }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:11px;color:#5F7A6C;background:#EFF5F1;border-radius:7px;padding:3px 7px\">{{ d.hospital }}<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ d.note }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:11px;color:#8A6A72;background:#FAF0F1;border-radius:7px;padding:3px 7px\">{{ d.note }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"padding:22px 20px 0\">\n    <button sc-camel-on-click=\"{{ share }}\" style=\"width:100%;border:1px solid #D7E2DA;background:#FFFFFF;border-radius:14px;padding:14px;font-size:13.5px;font-weight:700;color:#4E7261;cursor:pointer\" style-hover=\"background:#F4F8F5\">{{ shareLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}\">\nconst DATA = [\n  { id:'bcg', name:'BCG (결핵)', abbr:'BCG', color:'#CDE7DC', ink:'#2E6B54', doses:[{label:'1회', m:0, w:'생후 4주 이내'}] },\n  { id:'hepb', name:'B형간염', abbr:'HepB', color:'#CFE0F2', ink:'#2F5A87', doses:[{label:'1차', m:0, w:'출생 직후'},{label:'2차', m:1, w:'1개월'},{label:'3차', m:6, w:'6개월'}] },\n  { id:'dtap', name:'DTaP (디프테리아·파상풍·백일해)', abbr:'DTaP', color:'#F3D9C9', ink:'#8A5433', doses:[{label:'1차', m:2, w:'2개월'},{label:'2차', m:4, w:'4개월'},{label:'3차', m:6, w:'6개월'},{label:'4차', m:15, w:'15~18개월'},{label:'5차', m:48, w:'만 4~6세'}] },\n  { id:'ipv', name:'폴리오 (IPV)', abbr:'IPV', color:'#E0D6F1', ink:'#5A4785', doses:[{label:'1차', m:2, w:'2개월'},{label:'2차', m:4, w:'4개월'},{label:'3차', m:6, w:'6~18개월'},{label:'4차', m:48, w:'만 4~6세'}] },\n  { id:'hib', name:'Hib (b형헤모필루스인플루엔자)', abbr:'Hib', color:'#D8E8C8', ink:'#4F6B34', doses:[{label:'1차', m:2, w:'2개월'},{label:'2차', m:4, w:'4개월'},{label:'3차', m:6, w:'6개월'},{label:'4차', m:12, w:'12~15개월'}] },\n  { id:'pcv', name:'폐렴구균 (PCV)', abbr:'PCV', color:'#F7D9E3', ink:'#8B4A63', doses:[{label:'1차', m:2, w:'2개월'},{label:'2차', m:4, w:'4개월'},{label:'3차', m:6, w:'6개월'},{label:'4차', m:12, w:'12~15개월'}] },\n  { id:'rv', name:'로타바이러스', abbr:'RV', color:'#FBE6BC', ink:'#8A6520', optional:true, doses:[{label:'1차', m:2, w:'2개월'},{label:'2차', m:4, w:'4개월'},{label:'3차', m:6, w:'6개월 (5가 백신만)'}] },\n  { id:'mmr', name:'MMR (홍역·볼거리·풍진)', abbr:'MMR', color:'#C9E4EC', ink:'#2F6272', doses:[{label:'1차', m:12, w:'12~15개월'},{label:'2차', m:48, w:'만 4~6세'}] },\n  { id:'var', name:'수두', abbr:'VAR', color:'#EADDD0', ink:'#7A5B40', doses:[{label:'1회', m:12, w:'12~15개월'}] },\n  { id:'hepa', name:'A형간염', abbr:'HepA', color:'#D5E3F7', ink:'#3B5C8A', doses:[{label:'1차', m:12, w:'12~23개월'},{label:'2차', m:18, w:'1차 후 6개월 이상'}] },\n  { id:'je', name:'일본뇌염 (불활성화)', abbr:'JE', color:'#DCE3C9', ink:'#5C6636', doses:[{label:'1차', m:12, w:'12~23개월'},{label:'2차', m:13, w:'1차 후 7~30일'},{label:'3차', m:24, w:'2차 후 12개월'}] },\n  { id:'rsv', name:'RSV 항체주사 (니르세비맙)', abbr:'RSV', color:'#CFE7E4', ink:'#2C6B66', optional:true, doses:[{label:'1회', m:3, w:'첫 RSV 유행기 (10~3월) 진입 시'}] },\n  { id:'flu', name:'인플루엔자 (매년)', abbr:'IIV', color:'#F0D8E8', ink:'#7E4570', optional:true, doses:[{label:'1차', m:6, w:'생후 6개월 이후'},{label:'2차', m:7, w:'1차 후 4주 (첫해)'}] }\n];\n\nconst PILL = {\n  '완료': { bg:'#E6F2EA', fg:'#2F7A56' },\n  '지연': { bg:'#FBE3E1', fg:'#AD4A40' },\n  '예정': { bg:'#FFF1DC', fg:'#96682A' },\n  '대기': { bg:'#F2EEEA', fg:'#8A8290' }\n};\n\nconst SYNC = {\n  loading: { t:'연결 중…', bg:'#F2EEEA', fg:'#8A8290', b:'#E5DED7' },\n  saving:  { t:'저장 중…', bg:'#FFF1DC', fg:'#96682A', b:'#F0E0C4' },\n  ok:      { t:'공유 동기화 ✓', bg:'#E6F2EA', fg:'#2F7A56', b:'#CFE5D8' },\n  error:   { t:'오프라인 · 다시 시도', bg:'#FBE3E1', fg:'#AD4A40', b:'#F2D4D0' }\n};\n\nconst DAY = 86400000;\nconst BABY = '박지율';\nconst BIRTH = '2026-06-29';\n\nconst SUPA_URL = 'https://rnarvhqlozqpyhzdjpjb.supabase.co';\nconst SUPA_KEY = 'sb_publishable_Ci91dOGSaMeZApQQYmusNA_CLWIUZR1';\nconst TABLE = 'vax_records';\nconst HEADERS = { apikey:SUPA_KEY, Authorization:'Bearer ' + SUPA_KEY, 'Content-Type':'application/json' };\n\nclass Component extends DCLogic {\n  state = { records:{}, filter:'전체', open:null, sync:'loading', syncError:'', shared:false };\n  pending = 0;\n\n  familyCode() {\n    try {\n      const q = new URLSearchParams(window.location.search).get('family');\n      if (q) return q.trim();\n    } catch (e) {}\n    return 'jiyul';\n  }\n\n  componentDidMount() {\n    this.family = this.familyCode();\n    let saved = null;\n    try { saved = JSON.parse(localStorage.getItem('vaxbook-' + this.family) || 'null'); } catch (e) {}\n    if (saved && saved.records) this.setState({ records:saved.records });\n    this.pull();\n    this.timer = setInterval(() => {\n      if (!document.hidden && this.pending === 0) this.pull(true);\n    }, 12000);\n    this.onVis = () => { if (!document.hidden && this.pending === 0) this.pull(true); };\n    document.addEventListener('visibilitychange', this.onVis);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    document.removeEventListener('visibilitychange', this.onVis);\n  }\n\n  localSave(records) {\n    try { localStorage.setItem('vaxbook-' + this.family, JSON.stringify({ records })); } catch (e) {}\n  }\n\n  async pull(quiet) {\n    if (!quiet) this.setState({ sync:'loading' });\n    try {\n      const url = SUPA_URL + '/rest/v1/' + TABLE + '?select=*&family=eq.' + encodeURIComponent(this.family);\n      const res = await fetch(url, { headers:HEADERS });\n      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 90));\n      const rows = await res.json();\n      const records = {};\n      rows.forEach(r => { records[r.item_key] = { done:!!r.done, date:r.date || '', hospital:r.hospital || '', note:r.note || '' }; });\n      this.localSave(records);\n      this.setState({ records, sync:'ok', syncError:'' });\n    } catch (e) {\n      this.setState({ sync:'error', syncError:String(e.message || e) });\n    }\n  }\n\n  async push(key, rec) {\n    this.pending++;\n    this.setState({ sync:'saving' });\n    try {\n      const url = SUPA_URL + '/rest/v1/' + TABLE + '?on_conflict=family,item_key';\n      const res = await fetch(url, {\n        method:'POST',\n        headers:Object.assign({}, HEADERS, { Prefer:'resolution=merge-duplicates,return=minimal' }),\n        body:JSON.stringify({\n          family:this.family, item_key:key,\n          done:rec.done, date:rec.date, hospital:rec.hospital, note:rec.note,\n          updated_at:new Date().toISOString()\n        })\n      });\n      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 90));\n      this.setState({ sync:'ok', syncError:'' });\n    } catch (e) {\n      this.setState({ sync:'error', syncError:String(e.message || e) });\n    } finally {\n      this.pending = Math.max(0, this.pending - 1);\n    }\n  }\n\n  persist(next) {\n    this.setState(next, () => this.localSave(this.state.records));\n  }\n\n  rec(key) {\n    const r = this.state.records[key] || {};\n    return { done:!!r.done, date:r.date || '', hospital:r.hospital || r.memo || '', note:r.note || '' };\n  }\n\n  setRec(key, patch) {\n    const records = Object.assign({}, this.state.records);\n    records[key] = Object.assign({}, this.rec(key), patch);\n    this.persist({ records });\n    this.push(key, records[key]);\n  }\n\n  todayISO() {\n    const t = new Date();\n    return [t.getFullYear(), String(t.getMonth() + 1).padStart(2, '0'), String(t.getDate()).padStart(2, '0')].join('-');\n  }\n\n  dueDate(months) {\n    const p = BIRTH.split('-').map(Number);\n    const d = new Date(p[0], p[1] - 1, p[2]);\n    d.setMonth(d.getMonth() + months);\n    return d;\n  }\n\n  fmt(d) { return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate(); }\n\n  renderVals() {\n    const today = new Date(); today.setHours(0, 0, 0, 0);\n    const filter = this.state.filter;\n    const flat = [];\n\n    const vaccines = DATA.map(v => {\n      let vDone = 0;\n      const doses = v.doses.map((dd, i) => {\n        const key = v.id + '-' + i;\n        const r = this.rec(key);\n        const rec = this.dueDate(dd.m);\n        let planned = null;\n        if (!r.done && r.date) {\n          const p = r.date.split('-').map(Number);\n          if (p.length === 3 && !p.some(isNaN)) planned = new Date(p[0], p[1] - 1, p[2]);\n        }\n        const due = planned || rec;\n        const prefix = planned ? '예정' : '권장';\n        let status = '대기', diff = null;\n        if (r.done) { status = '완료'; vDone++; }\n        else if (due) {\n          diff = Math.round((due - today) / DAY);\n          if (diff < 0) status = '지연';\n          else if (diff <= 30) status = '예정';\n        }\n        let dateLine;\n        if (r.done) dateLine = r.date ? '접종 완료 · ' + r.date.replace(/-/g, '.') : '접종 완료';\n        else if (!due) dateLine = '생년월일을 입력하면 날짜가 계산돼요';\n        else if (diff < 0) dateLine = prefix + ' ' + this.fmt(due) + ' · ' + Math.abs(diff) + '일 지남';\n        else if (diff === 0) dateLine = prefix + ' ' + this.fmt(due) + ' · 오늘';\n        else dateLine = prefix + ' ' + this.fmt(due) + ' · D-' + diff;\n\n        const pill = PILL[status];\n        const open = this.state.open === key;\n        const item = {\n          key, label:dd.label, window:dd.w, status, dateLine, open,\n          date:r.date, hospital:r.hospital, note:r.note,\n          showMemo: !open && !!(r.hospital || r.note),\n          caret: open ? '⌃' : '⌄',\n          titleColor: r.done ? '#8B8396' : '#3B3540',\n          rowBg: r.done ? '#FCFCFA' : '#FFFFFF',\n          pillStyle: 'font-size:11px;font-weight:700;border-radius:8px;padding:4px 7px;white-space:nowrap;background:' + pill.bg + ';color:' + pill.fg,\n          checkStyle: 'width:28px;height:28px;flex:0 0 auto;border-radius:999px;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .15s;' + (r.done\n            ? 'border:none;background:#8FC3A6;color:#FFFFFF'\n            : 'border:2px solid #E0D8D1;background:#FFFFFF;color:#E8E2DC'),\n          toggle: () => {\n            const cur = this.rec(key);\n            this.setRec(key, cur.done ? { done:false } : { done:true, date:cur.date || this.todayISO() });\n          },\n          expand: () => this.setState({ open: open ? null : key }),\n          onDate: e => this.setRec(key, { date:e.target.value }),\n          onHospital: e => this.setRec(key, { hospital:e.target.value }),\n          onNote: e => this.setRec(key, { note:e.target.value })\n        };\n        flat.push({ v, d:item, due, prefix, done:r.done, optional:!!v.optional, status });\n        return item;\n      });\n\n      const all = vDone === v.doses.length;\n      return {\n        id:v.id, name:v.name, abbr:v.abbr, optional:!!v.optional, doses,\n        sub: v.doses.length + '회 접종 · ' + v.doses[0].w + ' 시작',\n        countLabel: vDone + '/' + v.doses.length,\n        countColor: all ? '#5BA37D' : '#A8A0B0',\n        badgeStyle: 'width:44px;height:44px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:-0.2px;background:' + v.color + ';color:' + v.ink,\n        _done:vDone, _total:v.doses.length\n      };\n    });\n\n    const totalCount = flat.length;\n    const doneCount = flat.filter(f => f.done).length;\n    const req = flat.filter(f => !f.optional);\n    const opt = flat.filter(f => f.optional);\n    const lateCount = flat.filter(f => f.status === '지연').length;\n\n    const pending = flat.filter(f => !f.done && f.due).sort((a, b) => a.due - b.due);\n    const n0 = pending[0], n1 = pending[1];\n    let nextKicker = '다가오는 접종', nextBg = '#F4F1E4', nextBorder = '#E8E2CE', nextDot = '#96682A';\n    if (n0 && n0.status === '지연') { nextKicker = '접종이 지났어요'; nextBg = '#FDEFED'; nextBorder = '#F4DCD8'; nextDot = '#AD4A40'; }\n\n    const list = vaccines.filter(v => {\n      if (filter === '필수') return !v.optional;\n      if (filter === '선택') return v.optional;\n      if (filter === '남은 것') return v._done < v._total;\n      return true;\n    });\n\n    const chips = ['전체', '필수', '선택', '남은 것'].map(label => ({\n      label,\n      select: () => this.setState({ filter:label }),\n      style: 'border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto;' + (filter === label\n        ? 'border:1px solid #3B3540;background:#3B3540;color:#FFFFFF'\n        : 'border:1px solid #E5DED7;background:#FFFFFF;color:#7E7688')\n    }));\n\n    const b = BIRTH.split('-').map(Number);\n    const bd = new Date(b[0], b[1] - 1, b[2]);\n    let ageTxt;\n    if (today < bd) {\n      ageTxt = '출생 예정';\n    } else {\n      let mo = (today.getFullYear() - bd.getFullYear()) * 12 + (today.getMonth() - bd.getMonth());\n      if (today.getDate() < bd.getDate()) mo--;\n      const anchor = new Date(bd.getFullYear(), bd.getMonth() + mo, bd.getDate());\n      const days = Math.round((today - anchor) / DAY);\n      const total = Math.round((today - bd) / DAY);\n      ageTxt = (mo > 0 ? '생후 ' + mo + '개월' + (days ? ' ' + days + '일' : '') : '생후 ' + total + '일') + ' (총 ' + total.toLocaleString() + '일)';\n    }\n\n    return {\n      subtitle: BIRTH.replace(/-/g, '.') + ' 출생 · ' + ageTxt,\n      doneCount, totalCount, lateCount,\n      reqDone: req.filter(f => f.done).length, reqTotal: req.length,\n      optDone: opt.filter(f => f.done).length, optTotal: opt.length,\n      barStyle: 'height:100%;border-radius:999px;background:linear-gradient(90deg,#A9CBB8,#8FC3A6);transition:width .35s;width:' + (totalCount ? Math.round(doneCount / totalCount * 100) : 0) + '%',\n      hasNext: !!n0, nextKicker, nextBg, nextBorder, nextDot,\n      nextTitle: n0 ? n0.v.name + ' ' + n0.d.label : '',\n      nextWhen: n0 ? n0.d.dateLine : '',\n      hasNextAfter: !!n1,\n      nextAfter: n1 ? n1.v.abbr + ' ' + n1.d.label + ' · ' + (n1.due ? n1.prefix + ' ' + this.fmt(n1.due) : '') : '',\n      chips, list,\n      family: this.family,\n      avatarOpen: !!this.state.avatarOpen,\n      openAvatar: () => this.setState({ avatarOpen:true }),\n      closeAvatar: () => this.setState({ avatarOpen:false }),\n      syncLabel: SYNC[this.state.sync].t,\n      syncStyle: 'border:1px solid ' + SYNC[this.state.sync].b + ';background:' + SYNC[this.state.sync].bg + ';color:' + SYNC[this.state.sync].fg + ';border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap',\n      syncError: this.state.sync === 'error' ? this.state.syncError : '',\n      refresh: () => this.pull(),\n      shareLabel: this.state.shared ? '링크가 복사됐어요 ✓' : '공유 링크 복사하기',\n      share: () => {\n        const u = new URL(window.location.href);\n        u.searchParams.set('family', this.family);\n        const link = u.toString();\n        const done = () => { this.setState({ shared:true }); setTimeout(() => this.setState({ shared:false }), 2500); };\n        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => window.prompt('이 링크를 복사하세요', link));\n        else window.prompt('이 링크를 복사하세요', link);\n      },\n      resetAll: async () => {\n        if (!window.confirm('모든 접종 기록을 지울까요? 공유된 기기에서도 함께 지워집니다.')) return;\n        this.persist({ records:{} });\n        try {\n          await fetch(SUPA_URL + '/rest/v1/' + TABLE + '?family=eq.' + encodeURIComponent(this.family), { method:'DELETE', headers:HEADERS });\n        } catch (e) {}\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
